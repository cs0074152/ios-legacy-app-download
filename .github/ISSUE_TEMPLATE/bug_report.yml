name: 问题反馈
description: 报告可复现的问题或文档错误，请移除账号及会话信息。
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "请勿提交账号、密码、验证码、Cookie、DSID、keychain 密码短语或 IPA。只提交脱敏后的信息。"
  - type: input
    id: environment
    attributes:
      label: 系统与工具版本
      placeholder: "Windows 11 / ipatool 2.6.0"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: "说明操作步骤及实际运行过的命令，敏感参数必须删除。"
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 预期结果与实际结果
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: 脱敏后的错误摘要
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私检查
      options:
        - label: "我已移除账号、密码、验证码、Cookie、DSID、会话文件和个人路径。"
          required: true
