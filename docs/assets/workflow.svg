<g font-family="Microsoft YaHei,PingFang SC,sans-serif"><circle cx="66" cy="64" r="20" fill="#263C2D"/><text x="66" y="69" text-anchor="middle" fill="#FFFFFF" font-family="Arial" font-size="14">01</text><text x="102" y="72" fill="#263C2D" font-size="23" font-weight="700">确认应用</text><text x="46" y="114" fill="#74806F" font-size="15">名称 · App ID · 商店地区</text>
